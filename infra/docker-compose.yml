services:
  postgres:
    image: postgres:16
    container_name: novacart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novacart
      POSTGRES_PASSWORD: novacart
      POSTGRES_DB: bi_anomaly
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacart -d bi_anomaly"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    container_name: novacart_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://novacart:novacart@postgres:5432/bi_anomaly
      SIM_SPEED_SECONDS_PER_TICK: "1"
    volumes:
      - ..:/app
    command: python -m ingestion.ingest

  api:
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    container_name: novacart_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://novacart:novacart@postgres:5432/bi_anomaly
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../infra/docker/dashboard.Dockerfile
    container_name: novacart_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../dashboard:/app
      - /app/node_modules

volumes:
  pg_data: